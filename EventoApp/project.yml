name: EventoApp
options:
  bundleIdPrefix: com.trescloud
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  EventoApp:
    type: application
    platform: iOS
    sources:
      - path: EventoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trescloud.evento
        PRODUCT_NAME: EventoApp
        INFOPLIST_FILE: Support/Info.plist
  EventoAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EventoAppTests
    dependencies:
      - target: EventoApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.trescloud.evento.tests
schemes:
  EventoApp:
    build:
      targets:
        EventoApp: all
        EventoAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EventoAppTests
